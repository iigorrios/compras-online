<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("tema")||"dark"}catch(e){}</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minhas Compras</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topo">
    <div class="wrap">
      <div class="marca">
        <h1>🛒 Minhas Compras</h1>
        <button id="tema" class="btn tema" type="button"></button>
      </div>
      <div class="resumo" id="resumo"></div>
    </div>
  </header>

  <main class="wrap">
    <section class="card novo">
      <h2>Adicionar produto</h2>
      <form id="form-produto" class="grid-form">
        <label class="span3">Link de compra — busca nome, foto e preço automaticamente
          <input name="url" type="url" placeholder="Cole aqui o link do produto (https://...)" autofocus>
        </label>
        <label class="span2">Nome do produto (opcional se colar o link)
          <input name="nome" placeholder="Deixe vazio para usar o nome da loja">
        </label>
        <label>Qtd.
          <input name="quantidade" type="number" min="1" value="1">
        </label>
        <label>Frete (R$)
          <input name="frete" inputmode="decimal" placeholder="0,00">
        </label>
        <label class="span2">Foto (URL, opcional)
          <input name="foto_url" type="url" placeholder="Usa a foto da loja se vazio">
        </label>
        <button class="btn primario span3" type="submit">Adicionar</button>
      </form>
    </section>

    <nav class="filtros">
      <div class="abas" id="abas">
        <button data-filtro="pendentes" class="ativa">A comprar</button>
        <button data-filtro="comprados">Comprados</button>
        <button data-filtro="todos">Todos</button>
      </div>
      <input id="busca" type="search" placeholder="Buscar produto…">
    </nav>

    <section id="lista" class="lista"></section>
  </main>

  <div id="toast" class="toast" hidden></div>

  <template id="tpl-produto">
    <article class="card produto">
      <div class="foto"><img alt=""><span class="sem-foto">📦</span></div>
      <div class="corpo">
        <div class="cab">
          <div>
            <h3 class="nome"></h3>
            <p class="obs"></p>
          </div>
          <label class="check"><input type="checkbox" class="comprado"> <span>Já comprei</span></label>
        </div>
        <div class="destaque"></div>
        <table class="ofertas">
          <thead><tr><th>Loja</th><th>Preço</th><th>Frete</th><th>Total</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
        <form class="form-link">
          <input name="url" type="url" required placeholder="Colar outro link de compra…">
          <input name="frete" inputmode="decimal" placeholder="Frete R$">
          <input name="preco" inputmode="decimal" placeholder="Preço (auto)">
          <button class="btn" type="submit">+ Link</button>
        </form>
        <div class="acoes">
          <button class="link-btn editar">Editar</button>
          <button class="link-btn perigo excluir">Excluir produto</button>
        </div>
      </div>
    </article>
  </template>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
